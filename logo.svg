<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 160" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B85C" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
  </defs>
  
  <!-- Imagotipo: Fusión de la 'A', la 'M' y un gráfico de crecimiento alcista -->
  <g transform="translate(20, 30)">
    <path d="M10,80 L40,20 L70,80 L55,80 L40,50 L25,80 Z" fill="url(#blueGrad)" />
    <path d="M40,50 L55,20 L85,80 L70,80 Z" fill="url(#greenGrad)" />
    <circle cx="85" cy="15" r="10" fill="#00E676" />
  </g>

  <!-- Tipografía -->
  <text x="135" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#0F172A" letter-spacing="-1">
    Autono<tspan fill="url(#blueGrad)">Metrics</tspan>
  </text>
  
  <!-- Subtítulo / Tagline -->
  <text x="140" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B" letter-spacing="3">
    AYUDAS Y CRECIMIENTO FINANCIERO
  </text>
</svg>
